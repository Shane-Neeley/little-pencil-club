<section class="controls lab" aria-labelledby="lab-title" data-motion-lab>
  <h2 id="lab-title">Synthetic motion lab</h2>
  <p>Mock previews use only the sample jellyfish.</p>
  <div class="actions">
    <button type="button" data-preview="preset">Suggest a move</button>
    <button type="button" data-preview="gif">Prepare mock GIF</button>
  </div>
  <div class="actions" data-gif-actions hidden>
    <button type="button" data-gif-play>Play GIF</button>
    <button type="button" data-gif-stop disabled>Stop GIF</button>
  </div>
  <img class="mock-gif" data-gif-image alt="Animated mock preview of the jellyfish" hidden>
  <p class="status" data-lab-status role="status">Ready to compare.</p>
</section>
